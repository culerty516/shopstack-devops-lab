apiVersion: apps.nebula-graph.io/v1alpha1
kind: NebulaCluster
metadata:
  name: shopstack-nebula
  namespace: data
spec:
  graphd:
    replicas: 1
    image: vesoft/nebula-graphd
    version: v3.8.0
    resources:
      requests:
        cpu: 200m
        memory: 500Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-1

  metad:
    replicas: 1
    image: vesoft/nebula-metad
    version: v3.8.0
    resources:
      requests:
        cpu: 300m
        memory: 500Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-1
    dataVolumeClaim:
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path

  storaged:
    replicas: 2
    image: vesoft/nebula-storaged
    version: v3.8.0
    resources:
      requests:
        cpu: 300m
        memory: 500Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeSelector:
      kubernetes.io/hostname: k8s-worker-1
    dataVolumeClaims:
      - resources:
          requests:
            storage: 2Gi
        storageClassName: local-path
    enableAutoBalance: true

  reference:
    name: statefulsets.apps
    version: v1

  schedulerName: default-scheduler
  imagePullPolicy: IfNotPresent
