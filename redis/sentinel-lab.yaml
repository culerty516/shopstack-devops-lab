apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-ha-0-data
  namespace: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
