apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-ha-headless
  namespace: data
spec:
  clusterIP: None
  selector:
    app: redis-sentinel-ha
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel-ha
  namespace: data
spec:
  serviceName: redis-sentinel-ha-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-sentinel-ha
  template:
    metadata:
      labels:
        app: redis-sentinel-ha
    spec:
      containers:
        - name: sentinel
          image: redis:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth-secret
                  key: redis-password
          command:
            - sh
            - -c
            - |
              set -eu

              cat > /tmp/sentinel.conf <<CONF
              port 26379
              dir /tmp
              sentinel resolve-hostnames yes
              sentinel monitor mymaster redis-ha-0.data.svc.cluster.local 6379 2
              sentinel auth-pass mymaster ${REDIS_PASSWORD}
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 15000
              sentinel parallel-syncs mymaster 1
              CONF

              exec redis-server /tmp/sentinel.conf --sentinel
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - PING
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
