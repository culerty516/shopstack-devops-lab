apiVersion: v1
kind: ServiceAccount
metadata:
  name: authz-test
  namespace: shopstack
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-authz-client
  namespace: shopstack
  labels:
    app: frontend-authz-client
spec:
  serviceAccountName: shopstack-frontend
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: authz-test-client
  namespace: shopstack
  labels:
    app: authz-test-client
spec:
  serviceAccountName: authz-test
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - sleep 3600
  restartPolicy: Never
