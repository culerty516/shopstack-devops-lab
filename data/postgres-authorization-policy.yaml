apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-shopstack-only
  namespace: data
spec:
  selector:
    matchLabels:
      app: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - shopstack
      to:
        - operation:
            ports:
              - "5432"
