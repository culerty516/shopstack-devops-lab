name: Build ShopStack Frontend

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build.outputs.image }}
      sha_tag: ${{ steps.build.outputs.sha_tag }}
      build_seconds: ${{ steps.build.outputs.build_seconds }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build and push multi-arch image
        id: build
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopstack-frontend"
          SHA_TAG="${IMAGE}:${GITHUB_SHA}"

          TAG_ARGS=(
            --tag "${SHA_TAG}"
          )

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_ARGS+=(
              --tag "${IMAGE}:${VERSION}"
            )
          fi

          START_TIME=$(date +%s)

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha,scope=shopstack-frontend \
            --cache-to type=gha,mode=max,scope=shopstack-frontend \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${TAG_ARGS[@]}" \
            frontend-src

          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_seconds=${BUILD_SECONDS}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Multi-arch image build"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Git SHA tag: \`${GITHUB_SHA}\`"
            echo "- Platforms: \`linux/amd64,linux/arm64\`"
            echo "- Build time: **${BUILD_SECONDS} seconds**"
            echo "- Cache: GitHub Actions Buildx cache"
          } >> "${GITHUB_STEP_SUMMARY}"

  scan:
    name: Trivy CRITICAL vulnerability gate
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Scan AMD64 image
        run: |
          docker run --rm \
            aquasec/trivy:0.74.0 \
            image \
            --scanners vuln \
            --exit-code 1 \
            --severity CRITICAL \
            --platform linux/amd64 \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}"

      - name: Scan ARM64 image
        run: |
          docker run --rm \
            aquasec/trivy:0.74.0 \
            image \
            --scanners vuln \
            --exit-code 1 \
            --severity CRITICAL \
            --platform linux/arm64 \
            "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}"

      - name: Record build time
        run: |
          {
            echo "### CI result"
            echo
            echo "- Multi-arch build time: **${{ needs.build.outputs.build_seconds }} seconds**"
            echo "- Trivy gate: no CRITICAL vulnerabilities detected"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy SHA image to kubeadm
    needs:
      - build
      - scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - task4-deploy

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure local CLI paths
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "${GITHUB_PATH}"
          echo "/opt/homebrew/opt/helm@3/bin" >> "${GITHUB_PATH}"
          echo "KUBECONFIG=${HOME}/.kube/task4-final-config" >> "${GITHUB_ENV}"

      - name: Ensure kubeadm API tunnel
        shell: bash
        run: |
          set -euo pipefail

          if ! nc -z 127.0.0.1 6443; then
            ssh -fN \
              -o BatchMode=yes \
              -o ExitOnForwardFailure=yes \
              -L 127.0.0.1:6443:10.10.0.10:6443 \
              k8s-cp
          fi

          kubectl \
            --context kubernetes-admin@kubernetes \
            get nodes

      - name: Deploy immutable SHA image with Helm
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPOSITORY="ghcr.io/${IMAGE_OWNER}/shopstack-frontend"

          helm upgrade --install shopstack-frontend \
            charts/frontend-chart \
            --namespace shopstack \
            --kube-context kubernetes-admin@kubernetes \
            --set image.repository="${IMAGE_REPOSITORY}" \
            --set-string image.tag="${GITHUB_SHA}" \
            --wait \
            --timeout 5m

      - name: Verify Kubernetes rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            --context kubernetes-admin@kubernetes \
            rollout status deployment/frontend \
            -n shopstack \
            --timeout=180s

          DEPLOYED_IMAGE="$(
            kubectl \
              --context kubernetes-admin@kubernetes \
              get deployment frontend \
              -n shopstack \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          )"

          IMAGE_OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_IMAGE="ghcr.io/${IMAGE_OWNER}/shopstack-frontend:${GITHUB_SHA}"

          echo "Expected: ${EXPECTED_IMAGE}"
          echo "Deployed: ${DEPLOYED_IMAGE}"

          test "${DEPLOYED_IMAGE}" = "${EXPECTED_IMAGE}"

      - name: Verify application response
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            --context kubernetes-admin@kubernetes \
            port-forward \
            -n shopstack \
            service/frontend \
            18088:80 \
            > /tmp/shopstack-ci-port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18088/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          BODY="$(curl -fsS http://127.0.0.1:18088/)"

          echo "${BODY}"

          echo "${BODY}" | grep -F "${GITHUB_SHA}"
          curl -fsS http://127.0.0.1:18088/healthz | grep -Fx "ok"

      - name: Record deployment summary
        shell: bash
        run: |
          {
            echo "### Deployment"
            echo
            echo "- Cluster: kubeadm"
            echo "- Namespace: \`shopstack\`"
            echo "- Helm release: \`shopstack-frontend\`"
            echo "- Image tag: \`${GITHUB_SHA}\`"
            echo "- Deployment method: \`helm upgrade --install --set-string image.tag=<git-sha>\`"
          } >> "${GITHUB_STEP_SUMMARY}"
